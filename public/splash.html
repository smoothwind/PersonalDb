<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PersonalDb</title>
    <style>
      :root { color-scheme: light dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; user-select: none; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px;
        background: linear-gradient(160deg, #0f2744 0%, #143a5f 55%, #0d2f4f 100%);
        color: #e8f1fa;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .logo { display: flex; align-items: center; gap: 14px; }
      .mark {
        width: 52px; height: 52px; border-radius: 12px;
        background: linear-gradient(135deg, #2ea3f2, #1668c7);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 6px 18px rgba(22, 104, 199, 0.45);
      }
      .mark svg { width: 30px; height: 30px; }
      .brand { font-size: 26px; font-weight: 600; letter-spacing: 0.5px; }
      .brand small { display: block; font-size: 11px; font-weight: 400; opacity: 0.65; letter-spacing: 2.5px; margin-top: 3px; }
      .bar { width: 200px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
      .bar i {
        display: block; height: 100%; width: 40%; border-radius: 2px;
        background: #4cb3ff; animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      .tip { font-size: 12px; opacity: 0.55; }
      .ver { position: absolute; bottom: 12px; right: 14px; font-size: 11px; opacity: 0.35; }
    </style>
  </head>
  <body>
    <div class="logo">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <ellipse cx="12" cy="5.5" rx="8" ry="3" />
          <path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" />
          <path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" />
        </svg>
      </div>
      <div class="brand">PersonalDb<small>DATABASE CLIENT</small></div>
    </div>
    <div class="bar"><i></i></div>
    <div class="tip">正在启动… / Starting…</div>
    <div class="ver" id="ver"></div>
    <script>
      try {
        var v = new URLSearchParams(location.search).get('v');
        document.getElementById('ver').textContent = v ? 'v' + v : '';
      } catch (e) { /* ignore */ }
    </script>
  </body>
</html>
