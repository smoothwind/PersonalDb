name: TEMP lock update (mysql_async / lru)

# 仅用于在无本地 Rust 工具链的机器上生成 Cargo.lock，完成后立即删除。
on:
  push:
    branches: [chore/deps-security]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/deps-security

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Locate rc.exe (Windows SDK)
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($rc) { "RC=$($rc.FullName)" >> $env:GITHUB_ENV }

      - name: Update lock and verify
        working-directory: src-tauri
        run: |
          cargo update -p mysql_async --precise 0.37.1
          cargo tree -i lru
          cargo check
          cargo check --no-default-features

      - name: Commit Cargo.lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/Cargo.toml
          if git diff --cached --quiet; then
            echo "lock unchanged"
          else
            git commit -m "chore(deps): mysql_async 0.37 / lru 0.18（安全更新）"
            git push
          fi
