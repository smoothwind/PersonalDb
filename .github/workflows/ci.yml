name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 安装包构建较慢（release profile 开了 lto），同一 ref 的新提交取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (types / tests / i18n)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 22.6+ 才有 --experimental-strip-types（check:i18n 依赖），Vite 8 另需 ≥22.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 版本跟随 oracle-bridge/go.mod 的 go 指令，避免工具链与模块要求不匹配
      - uses: actions/setup-go@v5
        with:
          go-version-file: src-tauri/oracle-bridge/go.mod
          cache-dependency-path: src-tauri/oracle-bridge/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # src-tauri/.cargo/config.toml 里写死了开发机的 SDK 版本路径，此处按 runner 实际 SDK 覆盖
      # （cargo 的 [env] 不覆盖已有进程环境变量，故 GITHUB_ENV 里的 RC 生效）
      - name: Locate rc.exe (Windows SDK)
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($rc) {
            Write-Host "RC=$($rc.FullName)"
            "RC=$($rc.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Warning "未找到 Windows SDK rc.exe，回退由 PATH 解析"
          }

      - name: Install frontend deps
        run: npm ci

      - name: i18n key diff (zh-CN vs en)
        run: npm run check:i18n

      - name: Frontend build (vue-tsc + vite)
        run: npm run build

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust check (default features)
        working-directory: src-tauri
        run: cargo check

      - name: Rust check (no default features)
        working-directory: src-tauri
        run: cargo check --no-default-features

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  bundle:
    name: Bundle Windows installers (MSI + NSIS)
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # edition 2024 需要 Rust 1.85+
      - uses: dtolnay/rust-toolchain@stable

      # oracle-bridge：build.rs 调 Go 编译为 sidecar（缺 Go 会静默跳过 → 无内置 Oracle 驱动）
      - uses: actions/setup-go@v5
        with:
          go-version-file: src-tauri/oracle-bridge/go.mod
          cache-dependency-path: src-tauri/oracle-bridge/go.sum

      # jdbc-bridge：build.rs 调 Maven 打包 fat jar，需要 JRE/JDK 21（JAVA_HOME 由本动作设置）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Locate rc.exe (Windows SDK)
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($rc) {
            Write-Host "RC=$($rc.FullName)"
            "RC=$($rc.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Warning "未找到 Windows SDK rc.exe，回退由 PATH 解析"
          }

      - name: Install frontend deps
        run: npm ci

      - name: Verify sidecar toolchains (Go / Java / Maven)
        shell: pwsh
        run: |
          go version
          mvn -v
          node -v
          "JAVA_HOME=$env:JAVA_HOME"

      # MSI 走 WiX、NSIS 走 nsis 工具链，均由 tauri CLI 首次自动下载
      - name: Build installers (tauri build --bundles msi,nsis)
        run: npm run bundle:all

      # build.rs 对缺失工具链只告警不报错，这里显式拦截，避免发出缺 sidecar 的安装包
      - name: Verify sidecars exist (src-tauri/binaries)
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @('oracle-bridge.exe', 'jdbc-bridge.jar')) {
            if (-not (Test-Path "src-tauri/binaries/$f")) { $missing += $f }
          }
          Get-ChildItem src-tauri/binaries | Format-Table Name, Length
          if ($missing.Count -gt 0) {
            Write-Error "sidecar 未生成：$($missing -join ', ')（Go/Maven 缺失或构建失败，安装包功能会不完整）"
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: personaldb-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: personaldb-nsis-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 打 v* 标签时附到草稿 Release（自动发布需把 draft 改为 false）
      - name: Attach installers to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PersonalDb ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
